[project]
name = "worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["websockets>=13", "sqlite-vec>=0.1.6"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
